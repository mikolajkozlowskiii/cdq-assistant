services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cdq-assistant-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: cdq-assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama-init-embeddings:
    image: ollama/ollama:latest
    container_name: ollama-init-embeddings
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=http://cdq-assistant-ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server..."
        sleep 10
        echo "Pulling nomic-embed-text embedding model..."
        ollama pull nomic-embed-text
        if [ $? -eq 0 ]; then
          echo "Embedding model downloaded successfully!"
          ollama list
        else
          echo "Failed to download embedding model"
          exit 1
        fi
    restart: "no"

  ollama-init-llm:
    image: ollama/ollama:latest
    container_name: ollama-init-llm
    profiles: ["cpu"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=http://cdq-assistant-ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server..."
        sleep 10
        echo "Pulling qwen3:4b model..."
        ollama pull qwen3:4b
        if [ $? -eq 0 ]; then
          echo "Model qwen3:4b downloaded successfully!"
          ollama list
        else
          echo "Failed to download model"
          exit 1
        fi
    restart: "no"

  ollama-init-llm-gpu:
    image: ollama/ollama:latest
    container_name: ollama-init-llm-gpu
    profiles: ["gpu"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=http://cdq-assistant-ollama:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server..."
        sleep 10
        echo "Pulling qwen3:4b model (GPU)..."
        ollama pull qwen3:4b
        if [ $? -eq 0 ]; then
          echo "Model qwen3:4b downloaded successfully!"
          ollama list
        else
          echo "Failed to download model"
          exit 1
        fi
    restart: "no"

  app:
    build: .
    container_name: cdq-assistant-app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-ollama}
      PGVECTOR_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://cdq-assistant-ollama:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      WEATHER_API_URL: ${WEATHER_API_URL}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_storage:
